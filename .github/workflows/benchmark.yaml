name: Warp Benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "TAG operating mode. tiered = local-tier store (block caching forced off, objects up to size_threshold stored locally)."
        type: choice
        options:
          - transparent # proxy cache in front of upstream (default)
          - tiered # two-tier store; small objects served entirely locally
        default: transparent
      cache_mode:
        description: "Cache mode to benchmark (ignored in tiered mode, which is whole-object only)"
        type: choice
        options:
          - blocks # block-aligned caching (RFC 0001) — the product default
          - whole # whole-object caching (block caching disabled) — baseline
        default: blocks
      size_threshold:
        description: "Max cacheable object size in bytes (empty = 1 GiB default; tiered defaults to 16 MiB when empty)."
        type: string
        default: ""
      block_size:
        description: "Block size in bytes for blocks mode (empty = 1 MiB default). e.g. 65536 to match the 64 KiB GET RANGE size."
        type: string
        default: ""
      duration:
        description: "Per-operation duration (empty = 30s default), e.g. 60s."
        type: string
        default: ""
      obj_size:
        description: "Object size for GET/PUT (empty = 4MiB). e.g. 64MiB to make full GETs span many blocks in blocks mode."
        type: string
        default: ""
      max_populate_memory:
        description: "Populate memory budget in bytes (empty = 2GiB default). Diagnostic knob for budget-contention hypotheses."
        type: string
        default: ""
      range_objects:
        description: "Distinct objects for GET RANGE (empty = 8). Shrinking the working set (e.g. 1) makes the run warm-hit-dominated instead of cold-miss-dominated."
        type: string
        default: ""
      range_obj_size:
        description: "Object size for GET RANGE (empty = 256MiB), e.g. 64MiB to shrink the block working set."
        type: string
        default: ""
  workflow_call:
    inputs:
      mode:
        description: "TAG operating mode: transparent (default) | tiered"
        type: string
        default: transparent
      cache_mode:
        description: "Cache mode to benchmark: blocks (default) | whole (ignored in tiered)"
        type: string
        default: blocks
      size_threshold:
        description: "Max cacheable object size in bytes (empty = 1 GiB; tiered defaults to 16 MiB)"
        type: string
        default: ""
      block_size:
        description: "Block size in bytes for blocks mode (empty = 1 MiB default)"
        type: string
        default: ""
      duration:
        description: "Per-operation duration (empty = 30s default)"
        type: string
        default: ""
      obj_size:
        description: "Object size for GET/PUT (empty = 4MiB)"
        type: string
        default: ""
      max_populate_memory:
        description: "Populate memory budget in bytes (empty = 2GiB default)"
        type: string
        default: ""
      range_objects:
        description: "Distinct objects for GET RANGE (empty = 8)"
        type: string
        default: ""
      range_obj_size:
        description: "Object size for GET RANGE (empty = 256MiB)"
        type: string
        default: ""
  schedule:
    # Nightly at 07:00 UTC (runs the product default: block-aligned caching)
    - cron: "0 7 * * *"

# Each run benchmarks against its own bucket (tag-warp-ci-<run id>): warp clears its bucket
# before and after every op, so two runs sharing a bucket would delete each other's objects
# mid-measurement (observed as sustained NoSuchKey download errors and garbage numbers).
# Per-run buckets make concurrent runs data-safe; they still share the Tigris account's
# bandwidth, so avoid overlapping heavy runs unless a simultaneous A/B pair is the point.
# The delete-bucket step below removes the run's bucket and sweeps any leaked ones.

env:
  GO_VERSION: "1.24.2"

jobs:
  warp-benchmarks:
    runs-on: namespace-profile-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Use reachable apt mirror
        # The runner image points apt at azure.archive.ubuntu.com, which is a
        # single point of failure (and unreliable outside Azure). Repoint to
        # the main Ubuntu archive before installing packages.
        run: |
          sudo grep -rl azure.archive.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'

      - name: Install system dependencies
        run: make install-deps

      # Block-aligned caching is the product default (v1.16.0+), so the default run — and the
      # scheduled/push nightly (empty cache_mode) — enables it, tracking what ships. cache_mode='whole'
      # disables it to benchmark the whole-object baseline. block_size tunes the granularity: empty
      # uses the 1 MiB default. warp GET RANGE reads 64 KiB ranges from 256 MiB objects (the SlateDB
      # pattern), so at 1 MiB blocks each 64 KiB read pulls a 1 MiB block (~16x read amplification);
      # pass block_size=65536 to size blocks to the range (1:1) and measure where block caching wins.
      #
      # mode=tiered benchmarks the local-tier store: block caching is FORCED off (tiered rejects it
      # at startup), and size_threshold defaults to 16 MiB so the benchmark's objects (kept <= that,
      # see the Run step) are stored and served entirely locally — zero upstream traffic, which is
      # the tiered path worth measuring. TAG_MODE/TAG_CACHE_SIZE_THRESHOLD are read from the
      # environment the binary inherits (like TAG_CACHE_MAX_POPULATE_MEMORY), so no Makefile change
      # is needed.
      - name: Start TAG (local mode)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TAG_MODE: ${{ inputs.mode }}
          # Tiered is whole-object only (tiered + block caching is a fatal config), so force it off
          # regardless of cache_mode; otherwise the whole/blocks choice stands.
          TAG_CACHE_BLOCK_CACHING_ENABLED: ${{ (inputs.mode == 'tiered' || inputs.cache_mode == 'whole') && 'false' || 'true' }}
          TAG_CACHE_BLOCK_SIZE: ${{ inputs.block_size }}
          # Explicit size_threshold wins; else tiered defaults to 16 MiB (16777216) and other modes
          # keep TAG's 1 GiB default.
          TAG_CACHE_SIZE_THRESHOLD: ${{ inputs.size_threshold != '' && inputs.size_threshold || (inputs.mode == 'tiered' && '16777216' || '') }}
          TAG_CACHE_MAX_POPULATE_MEMORY: ${{ inputs.max_populate_memory }}
        run: make s3-test-local

      # Warp knobs pass through as env; empty values fall back to run-warp.sh's defaults
      # (the script expands with ':-', which treats empty the same as unset). A
      # warm-hit-dominated GET RANGE run: range_objects=1 range_obj_size=64MiB shrinks the
      # block working set to ~1k blocks, so a standard-duration run's ~25k random reads hit
      # warm blocks almost entirely — measuring the serve path instead of upstream fetches.
      #
      # In tiered mode the objects must fit the local tier (<= size_threshold, 16 MiB by default)
      # or they forward upstream and the local-tier path is not measured. The full-object obj_size
      # default (4 MiB) already fits; only the GET RANGE object (256 MiB default) is too big, so it
      # defaults to 16 MiB in tiered when not explicitly set. An explicit override still wins — a
      # size above the threshold deliberately exercises the upstream-tier forward.
      - name: Run warp benchmarks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WARP_BUCKET: tag-warp-ci-${{ github.run_id }}
          WARP_DURATION: ${{ inputs.duration }}
          WARP_OBJ_SIZE: ${{ inputs.obj_size }}
          WARP_RANGE_OBJECTS: ${{ inputs.range_objects }}
          WARP_RANGE_OBJ_SIZE: ${{ inputs.range_obj_size != '' && inputs.range_obj_size || (inputs.mode == 'tiered' && '16MiB' || '') }}
        run: make bench-warp

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/benchmark/results/
          if-no-files-found: warn

      # Best-effort, never fails the job. warp's after-op clear leaves the bucket empty on a
      # clean run; the recursive rm covers ops that died mid-run. The sweep catches buckets
      # leaked by hard-killed jobs (cancelled/timed out before this step) — only per-run
      # (tag-warp-ci-*) buckets older than a day, so an in-flight run's bucket is never touched.
      - name: Delete benchmark bucket
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          ENDPOINT: https://t3.storage.dev
          BUCKET: tag-warp-ci-${{ github.run_id }}
        run: make bench-clean-buckets

      - name: Cleanup
        if: always()
        run: make s3-test-local-down
