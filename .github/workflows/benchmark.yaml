name: Warp Benchmarks

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "Cache mode to benchmark"
        type: choice
        options:
          - default # whole-object caching (default path)
          - blocks # block-aligned caching (RFC 0001)
        default: default
  workflow_call:
    inputs:
      cache_mode:
        description: "Cache mode to benchmark: default | blocks"
        type: string
        default: default
  schedule:
    # Nightly at 07:00 UTC (runs the default-mode benchmark)
    - cron: "0 7 * * *"

env:
  GO_VERSION: "1.24.2"

jobs:
  warp-benchmarks:
    runs-on: namespace-profile-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install system dependencies
        run: make install-deps

      # cache_mode selects the TAG target: 'blocks' enables block-aligned caching (small block
      # size on the local node), anything else (default, or an empty value for scheduled/push
      # runs) uses the default whole-object path.
      - name: Start TAG (local mode)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make ${{ inputs.cache_mode == 'blocks' && 's3-test-local-blocks' || 's3-test-local' }}

      - name: Run warp benchmarks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make bench-warp

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/benchmark/results/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: make s3-test-local-down
