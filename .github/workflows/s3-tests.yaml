name: S3 Compatibility Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_call:

env:
  GO_VERSION: "1.24.2"

jobs:
  s3-compat-tests:
    runs-on: namespace-profile-ubuntu-2404
    permissions:
      actions: write
      contents: read
      packages: write

    # Run the full suite twice: once with whole-object caching (default) and once with
    # block-aligned caching enabled (small block size), so block populate/assembly/range
    # paths get end-to-end coverage. fail-fast off so one mode's failure doesn't cancel the other.
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [default, blocks]

    name: s3-compat-tests (${{ matrix.cache_mode }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Use reachable apt mirror
        # The runner image points apt at azure.archive.ubuntu.com, which is a
        # single point of failure (and unreliable outside Azure). Repoint to
        # the main Ubuntu archive before installing packages.
        run: |
          sudo grep -rl azure.archive.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'

      - name: Install system dependencies
        run: make install-deps

      - name: Start TAG (local mode)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make ${{ matrix.cache_mode == 'blocks' && 's3-test-local-blocks' || 's3-test-local' }}

      - name: Run S3 compatibility tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make s3-tests

      - name: Run SDK tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make test-sdk

      - name: Cleanup
        if: always()
        run: make s3-test-local-down

  s3-compat-originless:
    runs-on: namespace-profile-ubuntu-2404
    permissions:
      actions: write
      contents: read
      packages: write

    name: s3-compat-originless

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Use reachable apt mirror
        run: |
          sudo grep -rl azure.archive.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'

      - name: Install system dependencies
        run: make install-deps

      # Fully hermetic — no credentials, no network. Exercises the production
      # topology exactly: origin-less TAG populated by direct SDK writes (as the
      # tigris gateway does), restarted on the same cache directory to prove
      # persistence, the whole read/write contract asserted with a stock
      # aws-sdk-go-v2 client, and then the ceph s3-tests subset covering the
      # origin-less surface (object writes/reads, ranges, conditionals,
      # metadata) run against it — the same suite the proxy-mode jobs run,
      # filtered to the operations this mode implements.
      - name: Run origin-less lifecycle test
        run: make s3-test-originless
