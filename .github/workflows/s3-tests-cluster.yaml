name: S3 Compatibility Tests (Cluster)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_call:

env:
  GO_VERSION: "1.24.2"

jobs:
  s3-compat-tests:
    runs-on: namespace-profile-ubuntu-2404
    permissions:
      actions: write
      contents: read
      packages: write

    # Run the 2-node cluster suite twice: whole-object caching (default) and block-aligned caching
    # (small block size) enabled on both nodes, so cross-node block routing/fetch gets end-to-end
    # coverage. fail-fast off so one mode's failure doesn't cancel the other.
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [default, blocks]

    name: s3-compat-tests-cluster (${{ matrix.cache_mode }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install system dependencies
        run: make install-deps

      - name: Start TAG (cluster mode)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make ${{ matrix.cache_mode == 'blocks' && 's3-test-local-cluster-blocks' || 's3-test-local-cluster' }}

      - name: Run S3 compatibility tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make s3-tests

      - name: Run SDK tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make test-sdk

      - name: Cleanup
        if: always()
        run: make s3-test-local-cluster-down
