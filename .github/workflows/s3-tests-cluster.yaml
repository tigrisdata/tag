name: S3 Compatibility Tests (Cluster)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_call:

env:
  GO_VERSION: "1.24.2"

jobs:
  s3-compat-tests:
    runs-on: namespace-profile-ubuntu-2404
    permissions:
      actions: write
      contents: read
      packages: write

    # Run the 2-node cluster suite with the default (whole-object caching) config only.
    # The blocks variant was dropped from CI to halve the duplicate compat runs; run it
    # locally with `make s3-test-local-cluster-blocks` when touching cross-node block
    # routing/fetch. The matrix form is kept so the job name (and any required-check
    # reference to it) stays stable.
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [default]

    name: s3-compat-tests-cluster (${{ matrix.cache_mode }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Use reachable apt mirror
        # The runner image points apt at azure.archive.ubuntu.com, which is a
        # single point of failure (and unreliable outside Azure). Repoint to
        # the main Ubuntu archive before installing packages.
        run: |
          sudo grep -rl azure.archive.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'

      - name: Install system dependencies
        run: make install-deps

      - name: Start TAG (cluster mode)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make ${{ matrix.cache_mode == 'blocks' && 's3-test-local-cluster-blocks' || 's3-test-local-cluster' }}

      - name: Run S3 compatibility tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make s3-tests

      - name: Run SDK tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: make test-sdk

      - name: Cleanup
        if: always()
        run: make s3-test-local-cluster-down
